name: Foundation CI

on:
  pull_request:
  push:

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python3 scripts/validate_continuity.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -r apps/backend/requirements-dev.txt
      - working-directory: apps/backend
        run: ruff check .
      - working-directory: apps/backend
        run: ruff format --check .
      - working-directory: apps/backend
        run: python manage.py check --settings=config.settings.test
      - working-directory: apps/backend
        run: pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.13.0", cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run doctor --workspace @barclimb/native
      - working-directory: apps/native
        run: CI=1 npx expo export --platform ios --output-dir dist-ios
      - working-directory: apps/native
        run: CI=1 npx expo export --platform android --output-dir dist-android
